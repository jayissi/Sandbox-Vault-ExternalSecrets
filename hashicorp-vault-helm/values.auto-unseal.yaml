---
# Auto-unseal sidecar configuration
# This overlay adds a sidecar container that automatically unseals Vault pods
# when they restart, using unseal keys stored in the vault-operator-init secret.
#
# Authentication Strategy (Least Privilege):
# 1. Primary: Kubernetes Auth with vault-ops role (limited to sys/raft, sys/health)
# 2. Fallback: Root token (only used during initial setup before K8s auth is configured)
#
# The sidecar runs vault-auto-unseal.sh from ConfigMap vault-auto-unseal-script
# (created by make create-configmap when VAULT_AUTO_UNSEAL=true).
# It also mounts the Vault Helm chart's existing 'home' emptyDir at /home/vault
# to share .vault-token with the Vault container.

server:
  extraContainers:
    - name: auto-unseal
      image: registry.access.redhat.com/ubi9/ubi:latest
      command:
        - /bin/bash
        - /scripts/vault-auto-unseal.sh
      env:
        - name: VAULT_ADDR
          value: "http://127.0.0.1:8200"
        - name: CHECK_INTERVAL
          value: "10"
        - name: UNSEAL_THRESHOLD
          value: "3"
        - name: UNSEAL_KEYS_FILE
          value: "/vault-unseal/unseal_keys_b64"
        - name: ROOT_TOKEN_FILE
          value: "/vault-unseal/root_token"
        - name: SHARED_TOKEN_FILE
          value: "/home/vault/.vault-token"
        - name: K8S_AUTH_ROLE
          value: "vault-ops"
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
      resources:
        requests:
          memory: 64Mi
          cpu: 10m
        limits:
          memory: 128Mi
          cpu: 100m
      volumeMounts:
        - name: unseal-keys
          mountPath: /vault-unseal
          readOnly: true
        - name: home
          mountPath: /home/vault
        - name: auto-unseal-script
          mountPath: /scripts
          readOnly: true

  volumes:
    - name: unseal-keys
      secret:
        secretName: vault-operator-init
        optional: true
    - name: auto-unseal-script
      configMap:
        name: vault-auto-unseal-script
        defaultMode: 0555
